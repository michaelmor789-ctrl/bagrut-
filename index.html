function CalendarView({ t, darkMode, exams }) {
const today = new Date();
const [viewDate, setViewDate] = useState(() => {
const upcoming = exams.filter(e => !e.completed && new Date(e.datetime) > new Date());
if (upcoming.length > 0) {
const closest = upcoming.sort((a,b) => new Date(a.datetime) - new Date(b.datetime))[0];
return new Date(closest.datetime);
}
return new Date();
});
const [selectedDay, setSelectedDay] = useState(null);

const month = viewDate.getMonth();
const firstDay = new Date(year, month, 1);
const daysInMonth = new Date(year, month + 1, 0).getDate();
const startDayOfWeek = firstDay.getDay();
const monthExams = exams.filter(e => {
const d = new Date(e.datetime);
return d.getFullYear() === year && d.getMonth() === month;

const examsByDay = {};
monthExams.forEach(e => {

(examsByDay[d] = examsByDay[d] || []).push(e);

const isToday = (day) =>
year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
const dayLabels = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const cells = [];
for (let i = 0; i < startDayOfWeek; i++) cells.push(null);
for (let d = 1; d <= daysInMonth; d++) cells.push(d);
const selectedDayExams = selectedDay !== null ? (examsByDay[selectedDay] || []) : [];
return (
<div className="fade-up">
<section style={{
background:t.card, borderRadius:18, padding:'18px 16px',
border:`1px solid ${t.borderSubtle}`, marginBottom:14,
}}>
<div style={{
display:'flex', justifyContent:'space-between', alignItems:'center',
marginBottom:14,
}}>
<button onClick={() => { setSelectedDay(null); setViewDate(new Date(year, month-1, 1)); }}
className="icon-btn" style={{
width:36, height:36, color:t.textMuted,
background:t.bg, border:`1px solid ${t.border}`, borderRadius:10,
}} aria-label="חודש קודם">
<Icon name="ChevronRight" size={16} />
</button>
<div style={{ textAlign:'center', flex:1 }}>
<div style={{ fontSize:18, fontWeight:800, letterSpacing:'-0.02em', color:t.text }}>
{HEBREW_MONTHS[month]} {year}
</div>
{(year !== today.getFullYear() || month !== today.getMonth()) && (
<button
onClick={() => { setSelectedDay(null); setViewDate(new Date()); }}
style={{
marginTop:2, background:'transparent', border:'none',
fontSize:11, color:t.accent, fontWeight:600, padding:0,
}}
>חזרה להיום</button>
)}
</div>
<button onClick={() => { setSelectedDay(null); setViewDate(new Date(year, month+1, 1)); }}

width:36, height:36, color:t.textMuted,

}} aria-label="חודש הבא">
<Icon name="ChevronLeft" size={16} />
</button>
</div>
<div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4, marginBottom:6 }}>
{dayLabels.map((l,i) => (
<div key={i} style={{
textAlign:'center', fontSize:11, fontWeight:700,
color:t.textSubtle, padding:'6px 0',

</div>
<div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4 }}>
{cells.map((day, idx) => {
if (day === null) return <div key={`e${idx}`} style={{aspectRatio:'1'}} />;
const dayExams = examsByDay[day] || [];
const hasExam = dayExams.length > 0;
const allCompleted = hasExam && dayExams.every(e => e.completed);
const upcoming = dayExams.filter(e => !e.completed);
const closestUp = upcoming.sort((a,b) => new Date(a.datetime) - new Date(b.datetime))[0];
const dColor = closestUp ? getStatusColor(calculateTimeLeft(closestUp.datetime).days, false) : null;
const todayCell = isToday(day);
const selected = selectedDay === day;
return (
<button key={day}
onClick={() => setSelectedDay(selected ? null : day)}
style={{
aspectRatio:'1', display:'flex', flexDirection:'column',
alignItems:'center', justifyContent:'center', gap:3,

background: selected ? t.accent

outlineOffset:'-1.5px',
fontFamily:'inherit',

<div className="num-tabular" style={{
fontSize:14, fontWeight: todayCell || hasExam ? 700 : 500,
color: selected ? t.accentText
: (hasExam && !allCompleted) ? dColor
: allCompleted ? t.textSubtle : t.text,
textDecoration: allCompleted && !selected ? 'line-through' : 'none',
lineHeight:1,
}}>{day}</div>
{hasExam && (
<div style={{display:'flex', gap:2}}>
{dayExams.slice(0,3).map((_,i) => (
<div key={i} style={{

background: selected ? t.accentText
: allCompleted ? t.textSubtle : dColor,
}}/>
))}
</div>
)}
</button>
);

revChunk = revChunk.replace(/\d{2,}/g, n => n.split('').reverse().join(''));
const fwd = extractFromChunk(origChunk);
const rev = extractFromChunk(revChunk);
const chosen = rev.score > fwd.score ? rev : fwd;
let subject = chosen.subject.replace(/\s*-\s*תכנית\s*חדשה\s*/, ' ').trim();
if (!subject) subject = 'מקצוע';
const dtStr = `${yyyy}-${mm}-${dd}T${hh.padStart(2,'0')}:${min}:00`;
exams.push({ subject: `${subject} ${shaalon}`, datetime: new Date(dtStr).toISOString(), note: chosen.note });
}
const seen = new Set();
return exams.filter(e => { const k = `${e.datetime}|${e.subject}`; if (seen.has(k)) return false; seen.add(k); return true; });
};
function ImportModal({ t, darkMode, onImport, onCancel }) {
const [mode, setMode] = useState('select');
const [fileName, setFileName] = useState('');
const [extracted, setExtracted] = useState([]);
const [error, setError] = useState('');
const processFile = async (file) => {
setMode('processing');
setError('');
setFileName(file.name);
try {
if (!file.type.includes('pdf') && !file.name.toLowerCase().endsWith('.pdf')) {
throw new Error('כרגע נתמכים רק קבצי PDF. בקרוב יתווסף תמיכה בתמונות.');
}
const pdfjs = await loadPdfJs();
const arrayBuffer = await file.arrayBuffer();
const pdf = await pdfjs.getDocument({data: arrayBuffer}).promise;
let fullText = '';
for (let i = 1; i <= pdf.numPages; i++) {
const page = await pdf.getPage(i);
const content = await page.getTextContent();
const pageText = content.items.map(it => it.str).join(' ');
fullText += pageText + ' ';
}
const parsed = parseBagrutText(fullText);
if (parsed.length === 0) {
throw new Error('לא זוהו מבחנים במסמך. ייתכן שהפורמט של ה-PDF שונה מהצפוי, או שהקובץ מבוסס תמונה במקום טקסט.');
}
setExtracted(parsed.map((e, i) => ({
...e,
selected: true,
tempId: i,
})));
setMode('preview');
} catch (e) {
setError(e.message || 'שגיאה בעיבוד הקובץ');
setMode('error');
}
};
const toggle = (id) => setExtracted(extracted.map(e => e.tempId === id ? {...e, selected:!e.selected} : e));
const handleConfirm = () => {
const selected = extracted.filter(e => e.selected);
if (selected.length === 0) return;
onImport(selected.map(({subject, datetime, note}) => ({subject, datetime, note})));
};
const selectedCount = extracted.filter(e => e.selected).length;
return (
<div className="fade-in" onClick={onCancel} style={{
position:'fixed', inset:0,
background: darkMode ? 'rgba(10,10,14,0.7)' : 'rgba(27,42,61,0.4)',
backdropFilter:'blur(8px)', zIndex:100,
display:'flex', alignItems:'flex-end', justifyContent:'center',
}}>
<div onClick={e => e.stopPropagation()} dir="rtl" style={{
background:t.cardElevated, width:'100%', maxWidth:520,
borderRadius:'24px 24px 0 0', padding:'24px 24px 28px',
maxHeight:'92vh', overflowY:'auto',
animation:'fadeUp 0.35s cubic-bezier(0.16,1,0.3,1)',
border:`1px solid ${t.border}`, borderBottom:'none',
paddingBottom:'calc(28px + env(safe-area-inset-bottom))',
}}>
<div style={{width:36, height:4, background:t.border, borderRadius:2, margin:'0 auto 20px'}}/>
<div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
<h3 style={{margin:0, fontSize:20, fontWeight:800, letterSpacing:'-0.02em', color:t.text}}>
{mode === 'select' ? 'ייבוא לוח בחינות' :
mode === 'processing' ? 'מנתח...' :
mode === 'preview' ? 'אישור מבחנים' : 'שגיאה'}
</h3>
<button onClick={onCancel} className="icon-btn" style={{
width:36, height:36, color:t.textMuted, background:t.card,
}} aria-label="סגור"><Icon name="X" size={18}/></button>
</div>
{mode === 'select' && (
<div style={{display:'flex', flexDirection:'column', gap:12}}>
<p style={{fontSize:14, color:t.textMuted, margin:'0 0 4px', lineHeight:1.5}}>
העלה את ה-PDF של הודעת הרישום ממשרד החינוך. האפליקציה תזהה את כל המבחנים אוטומטית — בלי צורך ב-API או חשבון.
</p>
<label style={{
display:'flex', alignItems:'center', gap:14,
padding:'16px 18px', background:t.card,
border:`1px solid ${t.border}`, borderRadius:14,
cursor:'pointer',
}}>
<div style={{
width:44, height:44, borderRadius:12,
background:t.accentSoft, color:t.accent,
display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
}}>
<Icon name="Upload" size={20}/>
</div>
<div style={{flex:1}}>
<div style={{fontWeight:700, fontSize:15, marginBottom:2}}>בחר קובץ PDF</div>
<div style={{fontSize:12, color:t.textMuted}}>הודעת רישום ממשרד החינוך</div>
</div>
<input
type="file"
accept="application/pdf,.pdf"
onChange={e => e.target.files?.[0] && processFile(e.target.files[0])}
style={{display:'none'}}
/>
</label>
<div style={{
fontSize:12, color:t.textSubtle, textAlign:'center',
lineHeight:1.5, marginTop:4,
}}>
העיבוד מתבצע במכשיר שלך בלבד — שום נתון לא נשלח לאינטרנט.
</div>
</div>
)}
{mode === 'processing' && (
<div style={{
display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
padding:'40px 20px', gap:16,
}}>
<div style={{
width:56, height:56, borderRadius:16,
background:`${t.accent}15`, color:t.accent,
display:'flex', alignItems:'center', justifyContent:'center',
}}>
<Icon name="Loader2" size={26} style={{animation:'spin 1s linear infinite'}}/>
</div>
<div style={{textAlign:'center'}}>
<div style={{fontSize:18, fontWeight:700, marginBottom:4, color:t.text}}>מזהה מבחנים...</div>
<div style={{fontSize:13, color:t.textMuted}}>{fileName ? `מנתח את ${fileName}` : 'עוד רגע...'}</div>
</div>
</div>
)}
{mode === 'preview' && (
<div style={{display:'flex', flexDirection:'column', gap:10}}>
<p style={{fontSize:13, color:t.textMuted, margin:'0 0 4px'}}>
נמצאו {extracted.length} מבחנים. סמן את אלו שתרצה להוסיף:
</p>
<div style={{display:'flex', flexDirection:'column', gap:8, maxHeight:'50vh', overflowY:'auto'}}>
{extracted.map(exam => (
<button key={exam.tempId} onClick={() => toggle(exam.tempId)} style={{
display:'flex', alignItems:'center', gap:12,
padding:'12px 14px',
background: exam.selected ? `${t.accent}10` : t.card,
border:`1px solid ${exam.selected ? t.accent : t.border}`,
borderRadius:12, cursor:'pointer',
fontFamily:'inherit', color:t.text, textAlign:'right',
}}>
<div style={{
width:22, height:22, borderRadius:6,
background: exam.selected ? t.accent : 'transparent',
border:`2px solid ${exam.selected ? t.accent : t.border}`,
display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
}}>
{exam.selected && <Icon name="Check" size={13} style={{color:t.accentText}} strokeWidth={3}/>}
</div>
<div style={{flex:1, minWidth:0}}>
<div style={{fontWeight:700, fontSize:15, marginBottom:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
{exam.subject}
</div>
<div style={{fontSize:12, color:t.textMuted}}>
{formatHebrewDate(exam.datetime)} · {formatTime(exam.datetime)}
</div>
</div>
</button>
))}
</div>
<div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:8}}>
<button onClick={() => setMode('select')} className="pressable" style={{
padding:14, background:t.card, color:t.text,
border:`1px solid ${t.border}`, borderRadius:12,
fontSize:15, fontWeight:600,
}}>ביטול</button>
<button onClick={handleConfirm} disabled={selectedCount === 0} className="pressable" style={{
padding:14,
background: selectedCount === 0 ? t.border : t.accent,
color: selectedCount === 0 ? t.textMuted : t.accentText,
border:'none', borderRadius:12,
fontSize:15, fontWeight:700,
cursor: selectedCount === 0 ? 'not-allowed' : 'pointer',
}}>הוסף ({selectedCount})</button>
</div>
</div>
)}
{mode === 'error' && (
<div style={{display:'flex', flexDirection:'column', gap:12}}>
<div style={{
display:'flex', alignItems:'flex-start', gap:12,
padding:'14px 16px', background:'#DD484815',
border:'1px solid #DD484830', borderRadius:12,
}}>
<Icon name="AlertCircle" size={18} style={{color:'#DD4848', marginTop:2}}/>
<div style={{fontSize:14, color:t.text, lineHeight:1.5}}>{error}</div>
</div>
<button onClick={() => { setMode('select'); setError(''); }} className="pressable" style={{
padding:14, background:t.accent, color:t.accentText,
border:'none', borderRadius:12,
fontSize:15, fontWeight:700,
}}>נסה שוב</button>
</div>
)}
</div>
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
