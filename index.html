<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ספירה לאחור לבגרויות</title>
<meta name="theme-color" content="#6366F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="בגרויות">
<link rel="manifest" href='data:application/json,{"name":"ספירה לאחור","short_name":"בגרויות","start_url":".","display":"standalone","background_color":"%230A0A14","theme_color":"%236366F1","orientation":"portrait"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  font-family: 'Rubik', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  font-feature-settings: 'ss01', 'cv11';
  letter-spacing: -0.01em;
}
input, textarea, button, select { font-family: inherit; font-size: 16px; letter-spacing: -0.01em; }
input:focus, textarea:focus, button:focus { outline: none; }
input, textarea { -webkit-appearance: none; appearance: none; }
button { cursor: pointer; border: none; background: transparent; color: inherit; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes confetti { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
@keyframes breathe { 0%,100% { transform: scale(0.6); opacity:0.5; } 40%,60% { transform: scale(1.2); opacity:1; } }
@keyframes glow { 0%,100% { box-shadow: 0 0 20px rgba(99,102,241,0.3); } 50% { box-shadow: 0 0 40px rgba(99,102,241,0.5); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes gradient-shift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

.fade-up { animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) backwards; }
.fade-in { animation: fadeIn 0.4s ease backwards; }
.scale-in { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) backwards; }
.pulse { animation: pulse 2s ease-in-out infinite; }
.glow { animation: glow 3s ease-in-out infinite; }
.press { transition: transform 0.15s cubic-bezier(0.16,1,0.3,1); }
.press:active { transform: scale(0.94); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; transition: all 0.2s ease; }
.icon-btn:active { transform: scale(0.9); }
.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

.glass {
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
}

.gradient-text {
  background: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% auto;
  animation: gradient-shift 4s ease infinite;
}

.scroll-hide::-webkit-scrollbar { display: none; }
.scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

/* Noise texture overlay */
.noise::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.015;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
}
</style>
</head>
