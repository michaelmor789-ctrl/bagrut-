<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Assistant', 'Heebo', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;

  input, textarea, button, select { font-family: inherit; font-size: 16px; }
  input:focus, textarea:focus, button:focus { outline: none; }
  input, textarea { -webkit-appearance: none; appearance: none; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  
  .fade-up { animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) backwards; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; border-radius: 50%;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .icon-btn:active { transform: scale(0.92); }
  
  .num-tabular { font-variant-numeric: tabular-nums; }
  
  .pressable { transition: transform 0.12s ease; }
  .pressable:active { transform: scale(0.96); }
  
  /* Hide scrollbars but allow scrolling */
  .scroll-area { scrollbar-width: thin; }
  
  @media (max-width: 380px) {
    .header-title { font-size: 20px !important; }

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// --- ICONS (lucide paths inline) ---
const I = {
  Plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  X: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  Check: '<polyline points="20 6 9 17 4 12"/>',
  CheckCircle2: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  Edit2: '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  Trash2: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  Moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  Sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  GraduationCap: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
  Sparkles: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.288-1.287Z"/>',
  Calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  Clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  ChevronLeft: '<path d="m15 18-6-6 6-6"/>',
  ChevronRight: '<path d="m9 18 6-6-6-6"/>',
  Archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  ListOrdered: '<line x1="10" x2="21" y1="6" y2="6"/><line x1="10" x2="21" y1="12" y2="12"/><line x1="10" x2="21" y1="18" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>',
  CalendarDays: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/>',
  Upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  FileText: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',
  Loader2: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  AlertCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  Key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
  ExternalLink: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
};

const Icon = ({ name, size = 16, strokeWidth = 2, style }) => (
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width={size} height={size} viewBox="0 0 24 24"
    fill="none" stroke="currentColor"
    strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
    style={{ flexShrink: 0, ...style }}
    dangerouslySetInnerHTML={{ __html: I[name] || '' }}
  />
);

// --- CONSTANTS ---
const QUOTES = [
  "כל מומחה היה פעם מתחיל.",
  "הצלחה היא הסכום של מאמצים קטנים שחוזרים על עצמם יום אחר יום.",
  "המחר שייך למי שמתכונן אליו היום.",
  "השקעה בידע משלמת את הריבית הטובה ביותר.",
  "אל תחכה. הזמן לעולם לא יהיה הזמן הנכון.",
  "עוד עמוד, עוד שאלה, עוד צעד קדימה.",
  "הצעד הראשון הוא תמיד הקשה ביותר.",
  "כל יום הוא הזדמנות להיות גרסה טובה יותר של עצמך.",
  "מי שזורע ידע - קוצר עתיד.",
  "המסע של אלף קילומטרים מתחיל בצעד אחד.",
  "אין קיצור דרך למקום ששווה להגיע אליו.",
  "הצלחה היא ללכת מכישלון לכישלון בלי לאבד התלהבות.",
];

const HEBREW_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const HEBREW_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

// --- HELPERS ---
const getQuoteOfDay = () => {
  const start = new Date(new Date().getFullYear(), 0, 0);
  const dayOfYear = Math.floor((new Date() - start) / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];
};

const calculateTimeLeft = (target) => {
  const diff = new Date(target) - new Date();
  if (diff <= 0) return { days:0, hours:0, minutes:0, seconds:0, expired:true };
  return {
    days: Math.floor(diff / 86400000),
    hours: Math.floor((diff / 3600000) % 24),
    minutes: Math.floor((diff / 60000) % 60),
    seconds: Math.floor((diff / 1000) % 60),
    expired: false,
  };
};

const formatHebrewDate = (s) => {
  const d = new Date(s);
  return `${d.getDate()} ב${HEBREW_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
};

const formatTime = (s) => {
  const d = new Date(s);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

const getStatusColor = (days, isPast) => {
  if (isPast) return '#94A3B8';
  if (days < 7) return '#DD4848';
  if (days < 14) return '#E89B47';
  if (days < 30) return '#D4B73E';
  return '#5BA76F';
};

const uid = () => Math.random().toString(36).slice(2, 11);

// localStorage wrapper
const store = {
  get: (k, def) => {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
    catch { return def; }
  },
  set: (k, v) => {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  },
};

// --- THEME ---
const getTheme = (darkMode) => darkMode ? {
  bg:'#0E1620', card:'#1A2330', cardElevated:'#212C3C',
  cardCream:'#2A2418', cardCreamBorder:'#3D3525',
  text:'#E8EFF5', textMuted:'#8A9AAD', textSubtle:'#5D6B7E',
  border:'#2A3543', borderSubtle:'#202A38',
  accent:'#5FA9C2', accentSoft:'#1A2D38', accentText:'#0E1620',
  tabBg:'#1A2330',
} : {
  bg:'#EEF4F9', card:'#FFFFFF', cardElevated:'#FFFFFF',
  cardCream:'#FEF8E8', cardCreamBorder:'#F4E8C8',
  text:'#1B2A3D', textMuted:'#6B7B8E', textSubtle:'#94A3B8',
  border:'#DCE5EC', borderSubtle:'#E8EEF3',
  accent:'#4F90A8', accentSoft:'#E6F0F4', accentText:'#FFFFFF',
  tabBg:'#E5EBF1',
};

// --- APP ---
function App() {
  const [exams, setExams] = useState(() => store.get('bagrut-exams', []));
  const [completed, setCompleted] = useState(() => store.get('bagrut-completed', []));
  const [darkMode, setDarkMode] = useState(() => store.get('bagrut-dark', false));
  const [geminiKey, setGeminiKey] = useState(() => store.get('bagrut-gemini-key', ''));
  const [activeTab, setActiveTab] = useState('active');
  const [showForm, setShowForm] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [editingExam, setEditingExam] = useState(null);
  const [now, setNow] = useState(new Date());
  
  useEffect(() => store.set('bagrut-exams', exams), [exams]);
  useEffect(() => store.set('bagrut-completed', completed), [completed]);
  useEffect(() => store.set('bagrut-dark', darkMode), [darkMode]);
  useEffect(() => store.set('bagrut-gemini-key', geminiKey), [geminiKey]);
  
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  
  const sortedExams = useMemo(
    () => [...exams].sort((a,b) => new Date(a.datetime) - new Date(b.datetime)),
    [exams]
  );
  const upcomingExams = useMemo(
    () => sortedExams.filter(e => new Date(e.datetime) > now),
    [sortedExams, now]
  );
  const closestExam = upcomingExams[0];
  const lastUpcoming = upcomingExams[upcomingExams.length - 1];
  const totalTimeLeft = lastUpcoming ? calculateTimeLeft(lastUpcoming.datetime) : null;
  
  const t = getTheme(darkMode);
  
  const handleSave = (data) => {
    if (editingExam) {
      setExams(exams.map(e => e.id === editingExam.id ? {...data, id: editingExam.id} : e));
    } else {
      setExams([...exams, {...data, id: uid()}]);
    }
    setShowForm(false); setEditingExam(null);
  };
  
  const handleEdit = (exam) => { setEditingExam(exam); setShowForm(true); };
  const handleDelete = (id) => setExams(exams.filter(e => e.id !== id));
  const handleComplete = (exam) => {
    setExams(exams.filter(e => e.id !== exam.id));
    setCompleted([{...exam, completedAt: new Date().toISOString()}, ...completed]);
  };
  const handleRestore = (exam) => {
    setCompleted(completed.filter(e => e.id !== exam.id));
    const { completedAt, ...rest } = exam;
    setExams([...exams, rest]);
  };
  const handleDeleteCompleted = (id) => setCompleted(completed.filter(e => e.id !== id));
  
  const handleBulkImport = (newExams) => {
    setExams([...exams, ...newExams.map(e => ({...e, id: uid()}))]);
    setShowImport(false);
  };
  
  // Apply theme to body
  useEffect(() => {
    document.body.style.background = t.bg;
    document.body.style.color = t.text;
    const meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (!meta) {
      const m = document.createElement('meta');
      m.name = 'theme-color';
      m.content = t.bg;
      document.head.appendChild(m);
    }
  }, [darkMode]);
  
  return (
    <div dir="rtl" style={{
      minHeight: '100vh', background: t.bg, color: t.text,
      paddingTop: 'env(safe-area-inset-top)',
      paddingBottom: 'env(safe-area-inset-bottom)',
      transition: 'background 0.3s ease',
    }}>
      <div style={{ maxWidth: 480, margin: '0 auto', padding: '20px 16px 100px' }}>
        
        {/* HEADER */}
        <header className="fade-in" style={{
          display:'flex', justifyContent:'space-between', alignItems:'flex-start',
          marginBottom: 16, gap: 12,
        }}>
          {/* Action buttons (visually left in RTL) */}
          <div style={{display:'flex', gap:8, alignItems:'center', flexShrink:0}}>
            <button
              className="pressable"
              onClick={() => { setEditingExam(null); setShowForm(true); }}
              style={{
                width:44, height:44, borderRadius:12, border:'none',
                background: t.accent, color: t.accentText,
                display:'inline-flex', alignItems:'center', justifyContent:'center',
                boxShadow: darkMode ? '0 4px 14px rgba(95,169,194,0.25)' : '0 4px 14px rgba(79,144,168,0.3)',
              }}
              aria-label="הוסף מבחן"
            >
              <Icon name="Plus" size={20} strokeWidth={2.6} />
            </button>
            <button
              className="pressable"
              onClick={() => setShowImport(true)}
              style={{
                height:44, padding:'0 12px', borderRadius:12,
                background: t.card, color: t.text,
                border:`1px solid ${t.border}`,
                display:'inline-flex', alignItems:'center', gap:6,
                fontSize:13, fontWeight:600,
              }}
              aria-label="ייבוא PDF"
            >
              <Icon name="Upload" size={15} strokeWidth={2.2} />
              <span>ייבוא PDF</span>
            </button>
            <button
              className="icon-btn"
              onClick={() => setDarkMode(!darkMode)}
              style={{ width:36, height:36, color: t.textMuted }}
              aria-label="מצב כהה"
            >
              <Icon name={darkMode ? "Sun" : "Moon"} size={18} />
            </button>
          </div>
          
          {/* Title block */}
          <div style={{
            display:'flex', alignItems:'flex-start', gap:10,
            minWidth:0, flexDirection:'row-reverse',
          }}>
            <div style={{
              width:40, height:40, borderRadius:12,
              background: t.accentSoft, color: t.accent,
              display:'flex', alignItems:'center', justifyContent:'center',
              flexShrink:0, marginTop:2,
            }}>
              <Icon name="GraduationCap" size={20} />
            </div>
            <div style={{ textAlign:'right', minWidth:0 }}>
              <h1 className="header-title" style={{
                margin:0, fontSize:22, fontWeight:800,
                letterSpacing:'-0.02em', lineHeight:1.15, color:t.text,
              }}>
                ספירה לאחור<br/>לבגרויות
              </h1>
              <div style={{
                fontSize:12, color:t.textMuted, marginTop:4, lineHeight:1.3,
              }}>
                המסע שלך לתעודה<br/>מתחיל כאן
              </div>
            </div>
          </div>
        </header>
        
        {/* DIVIDER */}
        <div style={{ height:1, background:t.border, margin:'0 -4px 16px' }} />
        
        {/* QUOTE */}
        <div className="fade-up" style={{
          background:t.card, border:`1px solid ${t.borderSubtle}`,
          borderRadius:16, padding:'14px 16px', marginBottom:14,
          display:'flex', alignItems:'flex-start', gap:12,
          animationDelay:'0.04s',
        }}>
          <div style={{
            width:36, height:36, borderRadius:10,
            background:t.accentSoft, color:t.accent,
            display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
          }}>
            <Icon name="Sparkles" size={18} />
          </div>
          <div style={{ flex:1, textAlign:'right' }}>
            <div style={{ fontSize:15, color:t.text, lineHeight:1.5, fontWeight:500 }}>
              {getQuoteOfDay()}
            </div>
            <div style={{ fontSize:12, color:t.textSubtle, marginTop:4, fontWeight:500 }}>
              ציטוט היום
            </div>
          </div>
        </div>
        
        {/* TABS */}
        <div className="fade-up" style={{
          display:'flex', gap:2, padding:4,
          background:t.tabBg, borderRadius:999,
          marginBottom:16, animationDelay:'0.07s',
        }}>
          {[
            {id:'archive', label:'ארכיון', count:completed.length, icon:'Archive'},
            {id:'calendar', label:'לוח שנה', count:null, icon:'CalendarDays'},
            {id:'active', label:'פעילים', count:exams.length, icon:'ListOrdered'},
          ].map(tab => {
            const isActive = activeTab === tab.id;
            return (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                style={{
                  flex:1, display:'flex', alignItems:'center', justifyContent:'center',
                  gap:6, padding:'9px 6px', border:'none', borderRadius:999,
                  background: isActive ? t.card : 'transparent',
                  color: isActive ? t.text : t.textMuted,
                  fontSize:13, fontWeight: isActive ? 700 : 500,
                  boxShadow: isActive ? (darkMode ? '0 1px 3px rgba(0,0,0,0.4)' : '0 1px 3px rgba(27,42,61,0.08)') : 'none',
                  transition:'all 0.2s ease',
                }}
              >
                <Icon name={tab.icon} size={14} strokeWidth={isActive ? 2.5 : 2} />
                <span>
                  {tab.label}{tab.count !== null && ` (${tab.count})`}
                </span>
              </button>
            );
          })}
        </div>
        
        {/* TAB CONTENT */}
        {activeTab === 'active' && (
          <ActiveTab
            t={t} darkMode={darkMode}
            sortedExams={sortedExams} upcomingExams={upcomingExams}
            closestExam={closestExam} totalTimeLeft={totalTimeLeft}
            now={now} exams={exams}
            onAdd={() => { setEditingExam(null); setShowForm(true); }}
            onEdit={handleEdit} onDelete={handleDelete} onComplete={handleComplete}
          />
        )}
        {activeTab === 'calendar' && (
          <CalendarView
            t={t} darkMode={darkMode}
            exams={[...upcomingExams, ...sortedExams.filter(e => new Date(e.datetime) <= now), ...completed.map(c => ({...c, completed:true}))]}
          />
        )}
        {activeTab === 'archive' && (
          <ArchiveTab
            t={t} darkMode={darkMode} completed={completed}
            onRestore={handleRestore} onDelete={handleDeleteCompleted}
          />
        )}
      </div>
      
      {showForm && (
        <ExamForm
          exam={editingExam} t={t} darkMode={darkMode}
          onSave={handleSave}
          onCancel={() => { setShowForm(false); setEditingExam(null); }}
        />
      )}
      
      {showImport && (
        <ImportModal
          t={t} darkMode={darkMode}
          geminiKey={geminiKey} setGeminiKey={setGeminiKey}
          onImport={handleBulkImport}
          onCancel={() => setShowImport(false)}
        />
      )}
    </div>
  );
}

// --- CALENDAR VIEW ---
function CalendarView({ t, darkMode, exams }) {
  const today = new Date();
  const [viewDate, setViewDate] = useState(() => {
    const upcoming = exams.filter(e => !e.completed && new Date(e.datetime) > new Date());
    if (upcoming.length > 0) {
      const closest = upcoming.sort((a,b) => new Date(a.datetime) - new Date(b.datetime))[0];
      return new Date(closest.datetime);
    }
    return new Date();
  });
  const [selectedDay, setSelectedDay] = useState(null);
  
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDayOfWeek = firstDay.getDay();
  
  const monthExams = exams.filter(e => {
    const d = new Date(e.datetime);
    return d.getFullYear() === year && d.getMonth() === month;
  });
  
  const examsByDay = {};
  monthExams.forEach(e => {
    const d = new Date(e.datetime).getDate();
    (examsByDay[d] = examsByDay[d] || []).push(e);
  });
  
  const isToday = (day) =>
    year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
  
  const dayLabels = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const cells = [];
  for (let i = 0; i < startDayOfWeek; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  
  const selectedDayExams = selectedDay !== null ? (examsByDay[selectedDay] || []) : [];
  
  return (
    <div className="fade-up">
      <section style={{
        background:t.card, borderRadius:18, padding:'18px 16px',
        border:`1px solid ${t.borderSubtle}`, marginBottom:14,
      }}>
        <div style={{
          display:'flex', justifyContent:'space-between', alignItems:'center',
          marginBottom:14,
        }}>
          <button onClick={() => { setSelectedDay(null); setViewDate(new Date(year, month-1, 1)); }}
            className="icon-btn" style={{
              width:36, height:36, color:t.textMuted,
              background:t.bg, border:`1px solid ${t.border}`, borderRadius:10,
            }} aria-label="חודש קודם">
            <Icon name="ChevronRight" size={16} />
          </button>
          <div style={{ textAlign:'center', flex:1 }}>
            <div style={{ fontSize:18, fontWeight:800, letterSpacing:'-0.02em', color:t.text }}>
              {HEBREW_MONTHS[month]} {year}
            </div>
            {(year !== today.getFullYear() || month !== today.getMonth()) && (
              <button
                onClick={() => { setSelectedDay(null); setViewDate(new Date()); }}
                style={{
                  marginTop:2, background:'transparent', border:'none',
                  fontSize:11, color:t.accent, fontWeight:600, padding:0,
                }}
              >חזרה להיום</button>
            )}
          </div>
          <button onClick={() => { setSelectedDay(null); setViewDate(new Date(year, month+1, 1)); }}
            className="icon-btn" style={{
              width:36, height:36, color:t.textMuted,
              background:t.bg, border:`1px solid ${t.border}`, borderRadius:10,
            }} aria-label="חודש הבא">
            <Icon name="ChevronLeft" size={16} />
          </button>
        </div>
        
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4, marginBottom:6 }}>
          {dayLabels.map((l,i) => (
            <div key={i} style={{
              textAlign:'center', fontSize:11, fontWeight:700,
              color:t.textSubtle, padding:'6px 0',
            }}>{l}</div>
          ))}
        </div>
        
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4 }}>
          {cells.map((day, idx) => {
            if (day === null) return <div key={`e${idx}`} style={{aspectRatio:'1'}} />;
            const dayExams = examsByDay[day] || [];
            const hasExam = dayExams.length > 0;
            const allCompleted = hasExam && dayExams.every(e => e.completed);
            const upcoming = dayExams.filter(e => !e.completed);
            const closestUp = upcoming.sort((a,b) => new Date(a.datetime) - new Date(b.datetime))[0];
            const dColor = closestUp ? getStatusColor(calculateTimeLeft(closestUp.datetime).days, false) : null;
            const todayCell = isToday(day);
            const selected = selectedDay === day;
            
            return (
              <button key={day}
                onClick={() => setSelectedDay(selected ? null : day)}
                style={{
                  aspectRatio:'1', display:'flex', flexDirection:'column',
                  alignItems:'center', justifyContent:'center', gap:3,
                  border:'none', borderRadius:10,
                  background: selected ? t.accent
                    : (hasExam && !allCompleted) ? `${dColor}20`
                    : todayCell ? t.bg : 'transparent',
                  outline: todayCell && !selected ? `1.5px solid ${t.accent}` : 'none',
                  outlineOffset:'-1.5px',
                  fontFamily:'inherit',
                }}>
                <div className="num-tabular" style={{
                  fontSize:14, fontWeight: todayCell || hasExam ? 700 : 500,
                  color: selected ? t.accentText
                    : (hasExam && !allCompleted) ? dColor
                    : allCompleted ? t.textSubtle : t.text,
                  textDecoration: allCompleted && !selected ? 'line-through' : 'none',
                  lineHeight:1,
                }}>{day}</div>
                {hasExam && (
                  <div style={{display:'flex', gap:2}}>
                    {dayExams.slice(0,3).map((_,i) => (
                      <div key={i} style={{
                        width:4, height:4, borderRadius:'50%',
                        background: selected ? t.accentText
                          : allCompleted ? t.textSubtle : dColor,
                      }}/>
                    ))}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </section>
      
      {selectedDayExams.length > 0 ? (
        <section className="fade-in">
          <h3 style={{
            fontSize:13, fontWeight:700, textTransform:'uppercase',
            letterSpacing:'0.12em', color:t.textMuted, margin:'0 0 12px',
          }}>{selectedDay} ב{HEBREW_MONTHS[month]}</h3>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {selectedDayExams.map(exam => {
              const tl = calculateTimeLeft(exam.datetime);
              const c = getStatusColor(tl.days, exam.completed);
              return (
                <div key={exam.id} style={{
                  background:t.card, borderRadius:12, padding:'12px 16px',
                  border:`1px solid ${t.borderSubtle}`,
                  display:'flex', alignItems:'center', gap:12,
                  opacity: exam.completed ? 0.6 : 1,
                }}>
                  <Icon name="Clock" size={16}
                    style={{ color: exam.completed ? t.textSubtle : c }} />
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{
                      fontWeight:700, fontSize:15,
                      textDecoration: exam.completed ? 'line-through' : 'none',
                    }}>{exam.subject}</div>
                    <div style={{fontSize:12, color:t.textMuted, marginTop:2}}>
                      {formatTime(exam.datetime)}
                      {!exam.completed && tl.days >= 0 && ` · בעוד ${tl.days} ימים`}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      ) : monthExams.length > 0 ? (
        <section className="fade-in">
          <h3 style={{
            fontSize:13, fontWeight:700, textTransform:'uppercase',
            letterSpacing:'0.12em', color:t.textMuted, margin:'0 0 12px',
          }}>מבחני {HEBREW_MONTHS[month]} ({monthExams.length})</h3>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {[...monthExams].sort((a,b) => new Date(a.datetime) - new Date(b.datetime)).map(exam => {
              const tl = calculateTimeLeft(exam.datetime);
              const c = getStatusColor(tl.days, exam.completed);
              const d = new Date(exam.datetime);
              return (
                <div key={exam.id} style={{
                  background:t.card, borderRadius:12, padding:'10px 14px',
                  border:`1px solid ${t.borderSubtle}`,
                  display:'flex', alignItems:'center', gap:12,
                  opacity: exam.completed ? 0.55 : 1,
                }}>
                  <div className="num-tabular" style={{
                    minWidth:32, textAlign:'center',
                    fontSize:20, fontWeight:800, lineHeight:1,
                    color: exam.completed ? t.textSubtle : c,
                  }}>{d.getDate()}</div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{
                      fontWeight:700, fontSize:14,
                      textDecoration: exam.completed ? 'line-through' : 'none',
                      overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                    }}>{exam.subject}</div>
                    <div style={{fontSize:11, color:t.textMuted}}>
                      יום {HEBREW_DAYS[d.getDay()]} · {formatTime(exam.datetime)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      ) : (
        <div style={{
          textAlign:'center', padding:'24px 20px',
          color:t.textMuted, fontSize:14,
        }}>אין מבחנים בחודש {HEBREW_MONTHS[month]}</div>
      )}
    </div>
  );
}

// --- EXAM FORM ---
function ExamForm({ exam, t, darkMode, onSave, onCancel }) {
  const [subject, setSubject] = useState(exam?.subject || '');
  const [date, setDate] = useState(exam ? new Date(exam.datetime).toISOString().split('T')[0] : '');
  const [time, setTime] = useState(exam ? new Date(exam.datetime).toTimeString().slice(0,5) : '09:00');
  const [note, setNote] = useState(exam?.note || '');
  const [error, setError] = useState('');
  
  const submit = () => {
    if (!subject.trim()) { setError('נא להזין שם של מקצוע'); return; }
    if (!date) { setError('נא לבחור תאריך'); return; }
    onSave({
      subject: subject.trim(),
      datetime: new Date(`${date}T${time}:00`).toISOString(),
      note: note.trim(),
    });
  };
  
  const inputStyle = {
    width:'100%', padding:'12px 14px',
    background:t.card, color:t.text,
    border:`1px solid ${t.border}`, borderRadius:10,
    fontSize:15, direction:'rtl',
  };
  
  return (
    <div className="fade-in" onClick={onCancel} style={{
      position:'fixed', inset:0,
      background: darkMode ? 'rgba(10,10,14,0.7)' : 'rgba(27,42,61,0.4)',
      backdropFilter:'blur(8px)', zIndex:100,
      display:'flex', alignItems:'flex-end', justifyContent:'center',
    }}>
      <div onClick={e => e.stopPropagation()} dir="rtl" style={{
        background:t.cardElevated, width:'100%', maxWidth:520,
        borderRadius:'24px 24px 0 0', padding:'24px 24px 28px',
        maxHeight:'92vh', overflowY:'auto',
        animation:'fadeUp 0.35s cubic-bezier(0.16,1,0.3,1)',
        border:`1px solid ${t.border}`, borderBottom:'none',
        paddingBottom: 'calc(28px + env(safe-area-inset-bottom))',
      }}>
        <div style={{
          width:36, height:4, background:t.border,
          borderRadius:2, margin:'0 auto 20px',
        }}/>
        <div style={{
          display:'flex', justifyContent:'space-between',
          alignItems:'center', marginBottom:18,
        }}>
          <h3 style={{
            margin:0, fontSize:20, fontWeight:800,
            letterSpacing:'-0.02em', color:t.text,
          }}>{exam ? 'עריכת מבחן' : 'מבחן חדש'}</h3>
          <button onClick={onCancel} className="icon-btn" style={{
            width:36, height:36, color:t.textMuted, background:t.card,
          }} aria-label="סגור"><Icon name="X" size={18}/></button>
        </div>
        
        <div style={{display:'flex', flexDirection:'column', gap:12}}>
          <Field label="מקצוע" t={t}>
            <input
              type="text" value={subject}
              onChange={e => { setSubject(e.target.value); setError(''); }}
              placeholder="למשל: מתמטיקה 5 יחידות"
              style={inputStyle} autoFocus
            />
          </Field>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
            <Field label="תאריך" t={t}>
              <input
                type="date" value={date}
                onChange={e => { setDate(e.target.value); setError(''); }}
                style={inputStyle}
              />
            </Field>
            <Field label="שעה" t={t}>
              <input
                type="time" value={time}
                onChange={e => setTime(e.target.value)}
                style={inputStyle}
              />
            </Field>
          </div>
          <Field label="הערה (לא חובה)" t={t}>
            <textarea
              value={note} onChange={e => setNote(e.target.value)}
              placeholder="למשל: להתמקד בנגזרות"
              rows={2}
              style={{...inputStyle, resize:'none', minHeight:56}}
            />
          </Field>
          
          {error && (
            <div style={{
              color:'#DD4848', fontSize:13,
              padding:'8px 12px', background:'#DD484815',
              borderRadius:8, fontWeight:500,
            }}>{error}</div>
          )}
          
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:6}}>
            <button onClick={onCancel} className="pressable" style={{
              padding:14, background:t.card, color:t.text,
              border:`1px solid ${t.border}`, borderRadius:12,
              fontSize:15, fontWeight:600,
            }}>ביטול</button>
            <button onClick={submit} className="pressable" style={{
              padding:14, background:t.accent, color:t.accentText,
              border:'none', borderRadius:12,
              fontSize:15, fontWeight:700,
            }}>{exam ? 'שמור' : 'הוסף'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Field({ label, t, children }) {
  return (
    <label style={{display:'block'}}>
      <div style={{
        fontSize:12, fontWeight:600, color:t.textMuted,
        marginBottom:6, textTransform:'uppercase', letterSpacing:'0.08em',
      }}>{label}</div>
      {children}
    </label>
  );
}

// --- IMPORT MODAL (PDF/Image upload via Gemini) ---
function ImportModal({ t, darkMode, geminiKey, setGeminiKey, onImport, onCancel }) {
  const [mode, setMode] = useState(geminiKey ? 'select' : 'setup');
  const [keyInput, setKeyInput] = useState('');
  const [fileName, setFileName] = useState('');
  const [extracted, setExtracted] = useState([]);
  const [error, setError] = useState('');
  
  const inputStyle = {
    width:'100%', padding:'12px 14px',
    background:t.card, color:t.text,
    border:`1px solid ${t.border}`, borderRadius:10,
    fontSize:15, direction:'ltr',
  };
  
  const saveKey = () => {
    const k = keyInput.trim();
    if (!k || k.length < 20) { setError('המפתח לא נראה תקין'); return; }
    setGeminiKey(k);
    setMode('select');
    setError('');
  };
  
  const processFile = async (file) => {
    setMode('processing');
    setError('');
    setFileName(file.name);
    try {
      const reader = new FileReader();
      const dataUrl = await new Promise((res, rej) => {
        reader.onload = () => res(reader.result);
        reader.onerror = () => rej(new Error('שגיאה בקריאת הקובץ'));
        reader.readAsDataURL(file);
      });
      const base64 = dataUrl.split(',')[1];
      const mimeType = file.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
      
      const prompt = `חלץ את כל מבחני הבגרות מהמסמך. עבור כל מבחן צריך: subject (שם המקצוע בעברית, כולל מספר שאלון אם קיים, למשל "מתמטיקה 35471"), date (פורמט YYYY-MM-DD), time (פורמט HH:MM 24 שעות, אם אין שעה השתמש ב-09:00), note (מיקום או הערה אם קיים, או מחרוזת ריקה). החזר JSON array בלבד, ללא טקסט מקדים, ללא markdown, ללא backticks. דוגמה: [{"subject":"מתמטיקה 35471","date":"2026-05-12","time":"09:00","note":"מכללת העיר"}]`;
      
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { inline_data: { mime_type: mimeType, data: base64 } },
                { text: prompt }
              ]
            }],
            generationConfig: { temperature: 0.1, responseMimeType: 'application/json' }
          })
        }
      );
      
      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        if (response.status === 400 || response.status === 401 || response.status === 403) {
          setError('המפתח לא תקף. תוכל לעדכן אותו למטה.');
          setMode('keyError');
          return;
        }
        throw new Error(errData.error?.message || `שגיאה ${response.status}`);
      }
      
      const data = await response.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const cleaned = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(cleaned);
      
      if (!Array.isArray(parsed) || parsed.length === 0) {
        throw new Error('לא זוהו מבחנים במסמך');
      }
      
      setExtracted(parsed.map((e, i) => ({
        subject: e.subject || 'מקצוע',
        date: e.date,
        time: e.time || '09:00',
        note: e.note || '',
        datetime: new Date(`${e.date}T${e.time || '09:00'}:00`).toISOString(),
        selected: true,
        tempId: i,
      })));
      setMode('preview');
    } catch (e) {
      setError(e.message || 'שגיאה בעיבוד');
      setMode('error');
    }
  };
  
  const toggle = (id) => setExtracted(extracted.map(e => e.tempId === id ? {...e, selected:!e.selected} : e));
  
  const handleConfirm = () => {
    const selected = extracted.filter(e => e.selected);
    if (selected.length === 0) return;
    onImport(selected.map(({subject, datetime, note}) => ({subject, datetime, note})));
  };
  
  const selectedCount = extracted.filter(e => e.selected).length;
  
  return (
    <div className="fade-in" onClick={onCancel} style={{
      position:'fixed', inset:0,
      background: darkMode ? 'rgba(10,10,14,0.7)' : 'rgba(27,42,61,0.4)',
      backdropFilter:'blur(8px)', zIndex:100,
      display:'flex', alignItems:'flex-end', justifyContent:'center',
    }}>
      <div onClick={e => e.stopPropagation()} dir="rtl" style={{
        background:t.cardElevated, width:'100%', maxWidth:520,
        borderRadius:'24px 24px 0 0', padding:'24px 24px 28px',
        maxHeight:'92vh', overflowY:'auto',
        animation:'fadeUp 0.35s cubic-bezier(0.16,1,0.3,1)',
        border:`1px solid ${t.border}`, borderBottom:'none',
        paddingBottom:'calc(28px + env(safe-area-inset-bottom))',
      }}>
        <div style={{width:36, height:4, background:t.border, borderRadius:2, margin:'0 auto 20px'}}/>
        
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18}}>
          <h3 style={{margin:0, fontSize:20, fontWeight:800, letterSpacing:'-0.02em', color:t.text}}>
            {mode === 'setup' ? 'הגדרה ראשונה' :
             mode === 'select' ? 'ייבוא לוח בחינות' :
             mode === 'processing' ? 'מנתח...' :
             mode === 'preview' ? 'אישור מבחנים' :
             mode === 'keyError' ? 'בעיה במפתח' : 'שגיאה'}
          </h3>
          <button onClick={onCancel} className="icon-btn" style={{
            width:36, height:36, color:t.textMuted, background:t.card,
          }} aria-label="סגור"><Icon name="X" size={18}/></button>
        </div>
        
        {mode === 'setup' && (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <p style={{fontSize:14, color:t.text, margin:0, lineHeight:1.6}}>
              כדי שהאפליקציה תוכל לקרוא PDF/תמונה ולחלץ את המבחנים, היא צריכה מפתח גישה ל-Google AI (Gemini).
              <br/><br/>
              <strong>הוא חינמי לחלוטין</strong> — לא צריך כרטיס אשראי.
            </p>
            
            <div style={{
              background:t.accentSoft, border:`1px solid ${t.borderSubtle}`,
              borderRadius:12, padding:'14px 16px',
            }}>
              <div style={{fontSize:13, fontWeight:700, color:t.text, marginBottom:8}}>איך מקבלים מפתח (פעם אחת):</div>
              <ol style={{margin:0, paddingInlineStart:20, fontSize:13, color:t.textMuted, lineHeight:1.7}}>
                <li>לחץ על הקישור: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style={{color:t.accent, fontWeight:700, textDecoration:'none'}}>aistudio.google.com/apikey ↗</a></li>
                <li>התחבר עם חשבון Google שלך</li>
                <li>לחץ "Create API key"</li>
                <li>העתק את המפתח (טקסט ארוך שמתחיל ב-AIza)</li>
                <li>חזור הנה והדבק אותו למטה</li>
              </ol>
            </div>
            
            <Field label="מפתח Gemini API" t={t}>
              <input
                type="text" value={keyInput}
                onChange={e => { setKeyInput(e.target.value); setError(''); }}
                placeholder="AIza..."
                style={inputStyle}
                autoFocus
              />
            </Field>
            
            {error && (
              <div style={{color:'#DD4848', fontSize:13, padding:'8px 12px', background:'#DD484815', borderRadius:8, fontWeight:500}}>{error}</div>
            )}
            
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:6}}>
              <button onClick={onCancel} className="pressable" style={{
                padding:14, background:t.card, color:t.text,
                border:`1px solid ${t.border}`, borderRadius:12,
                fontSize:15, fontWeight:600,
              }}>ביטול</button>
              <button onClick={saveKey} className="pressable" style={{
                padding:14, background:t.accent, color:t.accentText,
                border:'none', borderRadius:12,
                fontSize:15, fontWeight:700,
              }}>שמור</button>
            </div>
            
            <p style={{fontSize:11, color:t.textSubtle, margin:'8px 0 0', textAlign:'center', lineHeight:1.5}}>
              המפתח נשמר רק במכשיר שלך, לא נשלח לאף שרת חיצוני מלבד Google.
            </p>
          </div>
        )}
        
        {mode === 'select' && (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <p style={{fontSize:14, color:t.textMuted, margin:'0 0 4px', lineHeight:1.5}}>
              בחר תמונה או PDF של לוח הבחינות. ה-AI יחלץ את המבחנים אוטומטית.
            </p>
            
            <label style={{
              display:'flex', alignItems:'center', gap:14,
              padding:'16px 18px', background:t.card,
              border:`1px solid ${t.border}`, borderRadius:14,
              cursor:'pointer',
            }}>
              <div style={{
                width:44, height:44, borderRadius:12,
                background:t.accentSoft, color:t.accent,
                display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
              }}>
                <Icon name="Upload" size={20}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700, fontSize:15, marginBottom:2}}>בחר קובץ</div>
                <div style={{fontSize:12, color:t.textMuted}}>תמונה (JPG/PNG) או PDF</div>
              </div>
              <input
                type="file"
                accept="image/*,application/pdf"
                onChange={e => e.target.files?.[0] && processFile(e.target.files[0])}
                style={{display:'none'}}
              />
            </label>
            
            <button onClick={() => { setKeyInput(geminiKey); setMode('setup'); }} style={{
              background:'transparent', border:'none', color:t.textMuted,
              fontSize:12, padding:'6px 0', cursor:'pointer',
              display:'flex', alignItems:'center', gap:6, justifyContent:'center',
              fontFamily:'inherit',
            }}>
              <Icon name="Key" size={12}/>
              <span>החלפת מפתח API</span>
            </button>
          </div>
        )}
        
        {mode === 'processing' && (
          <div style={{
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
            padding:'40px 20px', gap:16,
          }}>
            <div style={{
              width:56, height:56, borderRadius:16,
              background:`${t.accent}15`, color:t.accent,
              display:'flex', alignItems:'center', justifyContent:'center',
            }}>
              <Icon name="Loader2" size={26} style={{animation:'spin 1s linear infinite'}}/>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:18, fontWeight:700, marginBottom:4, color:t.text}}>מזהה מבחנים...</div>
              <div style={{fontSize:13, color:t.textMuted}}>{fileName ? `מנתח את ${fileName}` : 'עוד רגע...'}</div>
            </div>
          </div>
        )}
        
        {mode === 'preview' && (
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            <p style={{fontSize:13, color:t.textMuted, margin:'0 0 4px'}}>
              נמצאו {extracted.length} מבחנים. סמן את אלו שתרצה להוסיף:
            </p>
            <div style={{display:'flex', flexDirection:'column', gap:8, maxHeight:'50vh', overflowY:'auto'}}>
              {extracted.map(exam => (
                <button key={exam.tempId} onClick={() => toggle(exam.tempId)} style={{
                  display:'flex', alignItems:'center', gap:12,
                  padding:'12px 14px',
                  background: exam.selected ? `${t.accent}10` : t.card,
                  border:`1px solid ${exam.selected ? t.accent : t.border}`,
                  borderRadius:12, cursor:'pointer',
                  fontFamily:'inherit', color:t.text, textAlign:'right',
                }}>
                  <div style={{
                    width:22, height:22, borderRadius:6,
                    background: exam.selected ? t.accent : 'transparent',
                    border:`2px solid ${exam.selected ? t.accent : t.border}`,
                    display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
                  }}>
                    {exam.selected && <Icon name="Check" size={13} style={{color:t.accentText}} strokeWidth={3}/>}
                  </div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontWeight:700, fontSize:15, marginBottom:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                      {exam.subject}
                    </div>
                    <div style={{fontSize:12, color:t.textMuted}}>
                      {formatHebrewDate(exam.datetime)} · {formatTime(exam.datetime)}
                    </div>
                  </div>
                </button>
              ))}
            </div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:8}}>
              <button onClick={() => setMode('select')} className="pressable" style={{
                padding:14, background:t.card, color:t.text,
                border:`1px solid ${t.border}`, borderRadius:12,
                fontSize:15, fontWeight:600,
              }}>ביטול</button>
              <button onClick={handleConfirm} disabled={selectedCount === 0} className="pressable" style={{
                padding:14,
                background: selectedCount === 0 ? t.border : t.accent,
                color: selectedCount === 0 ? t.textMuted : t.accentText,
                border:'none', borderRadius:12,
                fontSize:15, fontWeight:700,
                cursor: selectedCount === 0 ? 'not-allowed' : 'pointer',
              }}>הוסף ({selectedCount})</button>
            </div>
          </div>
        )}
        
        {mode === 'keyError' && (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <div style={{
              display:'flex', alignItems:'flex-start', gap:12,
              padding:'14px 16px', background:'#DD484815',
              border:'1px solid #DD484830', borderRadius:12,
            }}>
              <Icon name="AlertCircle" size={18} style={{color:'#DD4848', marginTop:2}}/>
              <div style={{fontSize:14, color:t.text, lineHeight:1.5}}>{error}</div>
            </div>
            <Field label="מפתח Gemini API חדש" t={t}>
              <input type="text" value={keyInput}
                onChange={e => setKeyInput(e.target.value)}
                placeholder="AIza..." style={inputStyle} autoFocus
              />
            </Field>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
              <button onClick={() => setMode('select')} className="pressable" style={{
                padding:14, background:t.card, color:t.text,
                border:`1px solid ${t.border}`, borderRadius:12,
                fontSize:15, fontWeight:600,
              }}>ביטול</button>
              <button onClick={saveKey} className="pressable" style={{
                padding:14, background:t.accent, color:t.accentText,
                border:'none', borderRadius:12,
                fontSize:15, fontWeight:700,
              }}>שמור</button>
            </div>
          </div>
        )}
        
        {mode === 'error' && (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <div style={{
              display:'flex', alignItems:'flex-start', gap:12,
              padding:'14px 16px', background:'#DD484815',
              border:'1px solid #DD484830', borderRadius:12,
            }}>
              <Icon name="AlertCircle" size={18} style={{color:'#DD4848', marginTop:2}}/>
              <div style={{fontSize:14, color:t.text, lineHeight:1.5}}>{error}</div>
            </div>
            <button onClick={() => { setMode('select'); setError(''); }} className="pressable" style={{
              padding:14, background:t.accent, color:t.accentText,
              border:'none', borderRadius:12,
              fontSize:15, fontWeight:700,
            }}>נסה שוב</button>
          </div>
        )}
      </div>
    </div>
  );
}

// --- RENDER ---
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
